name: titop-arenda

# Application processes receive an explicit allowlist instead of the complete
# deployment env file. In particular, they must never see the PostgreSQL
# superuser or GlitchTip database/Django secrets.
x-app-environment: &app-environment
  MEDIA_BASE_URL: ${MEDIA_BASE_URL:-}
  GLITCHTIP_BACKEND_DSN: ${GLITCHTIP_BACKEND_DSN:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  GLITCHTIP_TELEGRAM_WEBHOOK_SECRET: ${GLITCHTIP_TELEGRAM_WEBHOOK_SECRET:-}
  TELEGRAM_TIMEOUT: ${TELEGRAM_TIMEOUT:-10s}
  APP_ENV: ${APP_ENV:-production}
  MIN_APP_VERSION: ${MIN_APP_VERSION:-}
  APP_RELEASE: ${APP_RELEASE:-}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
  REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
  AUTH_EXPOSE_CODE: ${AUTH_EXPOSE_CODE:-false}
  HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
  HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-75s}
  SMTP_HOST: ${SMTP_HOST:-smtp.yandex.ru}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  UCALLER_API_URL: ${UCALLER_API_URL:-https://api.ucaller.ru}
  UCALLER_API_KEY: ${UCALLER_API_KEY:-}
  UCALLER_SERVICE_ID: ${UCALLER_SERVICE_ID:-}
  UCALLER_ENABLED: ${UCALLER_ENABLED:-false}
  UCALLER_TIMEOUT: ${UCALLER_TIMEOUT:-10s}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-yookassa}
  PAYMENT_API_URL: ${PAYMENT_API_URL:-https://api.yookassa.ru/v3}
  PAYMENT_SHOP_ID: ${PAYMENT_SHOP_ID:-}
  PAYMENT_SECRET: ${PAYMENT_SECRET:-}
  PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-titop-arenda://payments/return}
  PAYMENT_ADMIN_TOKEN: ${PAYMENT_ADMIN_TOKEN:-}
  PAYMENT_ADMIN_TOKEN_PREVIOUS: ${PAYMENT_ADMIN_TOKEN_PREVIOUS:-}
  PAYMENT_CAPTURE: ${PAYMENT_CAPTURE:-true}
  PAYMENT_PROVIDER_TIMEOUT: ${PAYMENT_PROVIDER_TIMEOUT:-15s}
  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
  EMAIL_UNSUBSCRIBE_SECRET: ${EMAIL_UNSUBSCRIBE_SECRET:-}
  EMAIL_DAILY_LIMIT: ${EMAIL_DAILY_LIMIT:-500}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  DADATA_API_KEY: ${DADATA_API_KEY:-}
  OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
  OVERPASS_TIMEOUT: ${OVERPASS_TIMEOUT:-12s}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_GENERATION_MODEL: ${LLM_GENERATION_MODEL:-}
  LLM_MODERATION_MODEL: ${LLM_MODERATION_MODEL:-}
  LLM_REVIEW_MODERATION_MODEL: ${LLM_REVIEW_MODERATION_MODEL:-}
  LLM_IMAGE_MODERATION_MODEL: ${LLM_IMAGE_MODERATION_MODEL:-Qwen/Qwen3.6-35B-A3B}
  LLM_CHAT_SUGGEST_MODEL: ${LLM_CHAT_SUGGEST_MODEL:-}
  LLM_TIMEOUT: ${LLM_TIMEOUT:-15s}
  FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
  FFPROBE_PATH: ${FFPROBE_PATH:-ffprobe}
  FFMPEG_TIMEOUT: ${FFMPEG_TIMEOUT:-60s}
  MEDIA_WORK_DIR: ${MEDIA_WORK_DIR:-}
  MAX_VIDEO_SECONDS: ${MAX_VIDEO_SECONDS:-60}
  MAX_VIDEO_MODERATION_FRAMES: ${MAX_VIDEO_MODERATION_FRAMES:-12}
  CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?set CENTRIFUGO_API_KEY}
  CENTRIFUGO_HMAC_SECRET: ${CENTRIFUGO_HMAC_SECRET:?set CENTRIFUGO_HMAC_SECRET}
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
  S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-}
  S3_REGION: ${S3_REGION:?set S3_REGION}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:?set S3_PUBLIC_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
  S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      APP_DB_NAME: ${APP_DB_NAME:-titop_arenda}
      APP_DB_USER: ${APP_DB_USER:-titop_arenda}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      GLITCHTIP_DB_NAME: ${GLITCHTIP_DB_NAME:-titop_glitchtip}
      GLITCHTIP_DB_USER: ${GLITCHTIP_DB_USER:-titop_glitchtip}
      GLITCHTIP_DB_PASSWORD: ${GLITCHTIP_DB_PASSWORD:?set GLITCHTIP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ../backend/db/baseline/schema.sql:/bootstrap/schema.sql:ro
      - ./postgres/catalog.sql:/bootstrap/catalog.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  migrate:
    image: migrate/migrate:v4.18.3
    restart: "no"
    command:
      - "-path=/migrations"
      - "-database=postgres://${APP_DB_USER:-titop_arenda}:${APP_DB_PASSWORD}@postgres:5432/${APP_DB_NAME:-titop_arenda}?sslmode=disable"
      - "up"
    volumes:
      - ../backend/db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${APP_DB_USER:-titop_arenda}:${APP_DB_PASSWORD}@postgres:5432/${APP_DB_NAME:-titop_arenda}?sslmode=disable
      CENTRIFUGO_URL: http://centrifugo:8000
      TRUST_PROXY_HEADERS: "true"
      # The API only enqueues media checks. It has no ffmpeg in its
      # distroless image and must not compete with media-worker for video jobs.
      ATTACHMENT_MODERATION_WORKER_ENABLED: "false"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      default:
        aliases:
          - api.internal
    depends_on:
      migrate:
        condition: service_completed_successfully
      centrifugo:
        condition: service_started
    mem_limit: 512m

  # Media worker: frame extraction for chat video and animated images.
  #
  # Runs the same binary as api, on an alpine base that can host ffmpeg (the api
  # image is distroless and cannot). Sizing is deliberate on a 4 GB / 2 core box
  # where postgres, api, centrifugo and glitchtip already reserve ~2.7 GB:
  #
  #   mem_limit 256m — measured peak for extracting 8 frames from a 30s 720p clip
  #                    is 47 MB, so this is roughly 5x headroom.
  #   cpus 0.75      — ffmpeg is CPU-bound and the API shares these two cores.
  #                    Capping it means a burst of uploads slows moderation, not
  #                    the chat itself.
  #
  # The worker claims jobs with FOR UPDATE SKIP LOCKED, so running it next to api
  # (which also starts the loop) is safe — no job is processed twice.
  media-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      <<: *app-environment
      # No HTTP listener needed here; the loopback bind keeps it unreachable.
      HTTP_ADDR: 127.0.0.1:8081
      DATABASE_URL: postgres://${APP_DB_USER:-titop_arenda}:${APP_DB_PASSWORD}@postgres:5432/${APP_DB_NAME:-titop_arenda}?sslmode=disable
      CENTRIFUGO_URL: http://centrifugo:8000
      ATTACHMENT_MODERATION_WORKER_ENABLED: "true"
    # Frames and downloaded videos live here and nowhere else: tmpfs keeps them
    # off the 50 GB disk and the size cap makes a burst fail loudly instead of
    # filling the filesystem.
    tmpfs:
      - /var/tmp/media-work:size=512m,mode=1777
    depends_on:
      migrate:
        condition: service_completed_successfully
      centrifugo:
        condition: service_started
    mem_limit: 256m
    cpus: 0.75

  centrifugo:
    image: centrifugo/centrifugo:v6
    restart: unless-stopped
    environment:
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:?set CENTRIFUGO_API_KEY}
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_HMAC_SECRET:?set CENTRIFUGO_HMAC_SECRET}
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ../centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 256m

  glitchtip:
    image: glitchtip/glitchtip:6.2.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${GLITCHTIP_DB_USER:-titop_glitchtip}:${GLITCHTIP_DB_PASSWORD}@postgres:5432/${GLITCHTIP_DB_NAME:-titop_glitchtip}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?set GLITCHTIP_SECRET_KEY}
      GLITCHTIP_DOMAIN: https://errors.titop.ru
      ALLOWED_HOSTS: errors.titop.ru
      CSRF_TRUSTED_ORIGINS: https://errors.titop.ru
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:?set GLITCHTIP_EMAIL_URL}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_DEFAULT_FROM_EMAIL:-notifications@titop.ru}
      SERVER_ROLE: all_in_one
      VALKEY_URL: ""
      GLITCHTIP_RETENTION_DAYS: "30"
      GLITCHTIP_EVENT_HOT_DAYS: "14"
      GLITCHTIP_ENABLE_LOGS: "false"
      GLITCHTIP_ENABLE_UPTIME: "false"
      ENABLE_USER_REGISTRATION: "false"
      ENABLE_ORGANIZATION_CREATION: "false"
      DATABASE_POOL_MAX_SIZE: "5"
      VTASKS_CONCURRENCY: "5"
      GRANIAN_WORKERS: "1"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - glitchtip_uploads:/code/uploads
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 900m

volumes:
  postgres_data:
  glitchtip_uploads:
