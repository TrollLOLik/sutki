# Public legal documents are static files, not API routes. This snippet must
# be included in every arenda.wigaj.ru server block that handles requests
# (especially the HTTPS block generated by Certbot).
location = /legal {
    return 308 /legal/;
}

location ^~ /legal/ {
    root /var/www/wigaj-arenda;
    try_files $uri $uri/index.html =404;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}

location ^~ /assets/legal/ {
    root /var/www/wigaj-arenda;
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
}
